<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Challenge Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="top-bar">
    <button id="cal-btn" onclick="openCal()">Log</button>
    <span id="day-label" style="flex:1;text-align:center"></span>
    <button id="challenge-btn" onclick="openChallenge()">Goal</button>
  </div>

  <div id="ring-wrap">
    <svg id="ring-svg" viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#c8921a"/>
          <stop offset="60%" stop-color="#f0c040"/>
          <stop offset="100%" stop-color="#d4a030"/>
        </linearGradient>
      </defs>
      <circle cx="130" cy="130" r="106" fill="none" stroke="#ede8df" stroke-width="13"/>
      <circle id="progress-ring" cx="130" cy="130" r="106" fill="none"
              stroke="url(#goldGrad)" stroke-width="13" stroke-linecap="round"
              stroke-dasharray="666.02" stroke-dashoffset="666.02"
              transform="rotate(-90 130 130)"/>
    </svg>
    <div id="time-center">
      <div id="time-display">0h 00m</div>
      <div id="active-type-label">&nbsp;</div>
      <div id="time-sub">of 10h goal</div>
      <div id="pct-label">0%</div>
    </div>
  </div>

  <div id="cat-selector"></div>

  <button id="start-stop" onclick="toggleTimer()">
    <span id="dot"></span>
    <span id="btn-label">Start</span>
  </button>

  <div id="summary">
    <div class="sum-item">
      <div class="sum-label">Today</div>
      <div class="sum-time" id="sum-study">0h 00m</div>
      <div class="sum-bar-wrap"><div class="sum-bar-amber" id="bar-study" style="width:0%"></div></div>
    </div>
    <div class="sum-item">
      <div class="sum-label-neutral">Done</div>
      <div class="sum-neutral" id="sum-days">0 / 7</div>
      <div class="sum-bar-wrap"><div class="sum-bar-neutral" id="bar-days" style="width:0%"></div></div>
    </div>
  </div>

  <div id="streak-section">
    <div id="streak-left">
      <div id="streak-label">Streak</div>
      <div id="streak-count">0 days</div>
      <div id="streak-since"></div>
    </div>
    <button id="streak-reset" onclick="resetStreak()">Reset</button>
  </div>
</div>

<!-- LOG OVERLAY -->
<div id="overlay">
  <div id="overlay-inner">
    <div id="cal-header">
      <span id="cal-title">Challenge Log</span>
      <button id="close-btn" onclick="closeCal()">✕</button>
    </div>

    <div id="overlay-tabs">
      <button class="tab-btn active" id="tab-monthly-btn" onclick="switchTab('monthly')">Calendar</button>
      <button class="tab-btn" id="tab-alltime-btn" onclick="switchTab('alltime')">History</button>
      <button class="tab-btn" id="tab-streak-btn" onclick="switchTab('streak')">Streak</button>
    </div>

    <!-- CALENDAR TAB -->
    <div id="tab-monthly" class="tab-content visible">
      <div id="month-nav">
        <button class="month-nav-btn" onclick="prevMonth()">‹</button>
        <span id="monthly-title"></span>
        <button class="month-nav-btn" onclick="nextMonth()">›</button>
      </div>
      <div class="stats-row" id="stats-monthly"></div>
      <div id="cal-monthly"></div>
      <div class="chart-section" style="margin-top:1rem">
        <div class="chart-title" id="chart-monthly-title"></div>
        <div style="position:relative; height:180px;">
          <canvas id="chart-monthly"></canvas>
        </div>
      </div>
    </div>

    <!-- STREAK TAB -->
    <div id="tab-streak" class="tab-content">
      <div class="streak-summary">
        <div>
          <div class="streak-big" id="streak-tab-count">0</div>
          <div class="streak-meta" id="streak-tab-since"></div>
        </div>
        <div>
          <div class="streak-resets-badge" id="streak-tab-resets">0</div>
          <div class="streak-resets-lbl">Resets</div>
        </div>
      </div>
      <div class="streak-history-title">Reset History</div>
      <div id="streak-history-list"></div>
      <button class="streak-reset-btn-overlay" onclick="resetStreak()">Reset Streak</button>
    </div>

    <!-- ALL TIME TAB -->
    <div id="tab-alltime" class="tab-content">
      <div class="stats-row" id="stats-alltime"></div>
      <div class="chart-section">
        <div class="chart-title">All Time — Daily Hours</div>
        <div style="position:relative; height:220px;">
          <canvas id="chart-alltime"></canvas>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- CATEGORY MODAL -->
<div id="cat-modal">
  <div id="cat-modal-inner">
    <div class="cat-modal-title">Categories</div>
    <div id="cat-list"></div>
    <hr class="cat-divider">
    <div class="ch-field">
      <label class="ch-label">New Category Name</label>
      <input type="text" id="cat-name-input" class="ch-input" placeholder="e.g. Reading" maxlength="30">
    </div>
    <div class="ch-label" style="margin-bottom:0.45rem">Colour</div>
    <div class="cat-color-row" id="cat-color-row"></div>
    <div class="cat-modal-btns">
      <button class="cat-modal-cancel" onclick="closeCatModal()">Close</button>
      <button class="cat-modal-save" onclick="addCategory()">Add</button>
    </div>
  </div>
</div>

<!-- CHALLENGE OVERLAY -->
<div id="challenge-overlay">
  <div id="challenge-inner">
    <div id="ch-header">
      <span id="ch-title">Challenge</span>
      <button id="ch-close-btn" onclick="closeChallenge()">✕</button>
    </div>

    <!-- Active challenge -->
    <div id="ch-active-view" style="display:none">
      <div class="ch-card">
        <div class="ch-card-name" id="ch-card-name"></div>
        <div class="ch-stats-row">
          <div class="ch-stat"><div class="ch-stat-val" id="ch-stat-day"></div><div class="ch-stat-lbl">Day</div></div>
          <div class="ch-stat"><div class="ch-stat-val" id="ch-stat-left"></div><div class="ch-stat-lbl">Days Left</div></div>
          <div class="ch-stat"><div class="ch-stat-val" id="ch-stat-goal"></div><div class="ch-stat-lbl">Daily Goal</div></div>
          <div class="ch-stat"><div class="ch-stat-val" id="ch-stat-done"></div><div class="ch-stat-lbl">Done</div></div>
        </div>
        <div class="ch-days-grid" id="ch-days-grid"></div>
      </div>
      <div class="chart-section" style="margin-top:1rem">
        <div class="chart-title" id="ch-chart-title">Daily Hours</div>
        <div style="position:relative; height:160px;">
          <canvas id="chart-challenge"></canvas>
        </div>
      </div>
      <button class="ch-end-btn" onclick="endChallenge()">End Challenge Early</button>
    </div>

    <!-- Complete state -->
    <div id="ch-complete-view" style="display:none">
      <div class="ch-card">
        <div class="ch-complete-banner">Complete!</div>
        <div class="ch-card-name" id="ch-complete-name"></div>
        <div class="ch-stats-row">
          <div class="ch-stat"><div class="ch-stat-val" id="ch-complete-done"></div><div class="ch-stat-lbl">Days Met</div></div>
          <div class="ch-stat"><div class="ch-stat-val" id="ch-complete-hours"></div><div class="ch-stat-lbl">Total Hours</div></div>
        </div>
      </div>
      <button class="ch-start-btn" onclick="showChallengeForm()">New Challenge</button>
    </div>

    <!-- Form -->
    <div id="ch-form-view">
      <div class="ch-form-title">New Challenge</div>
      <div class="ch-field">
        <label class="ch-label">Name (optional)</label>
        <input type="text" id="ch-name-input" class="ch-input" placeholder="e.g. 8-Day Sprint" maxlength="40">
      </div>
      <div class="ch-field">
        <label class="ch-label">Duration</label>
        <div class="ch-stepper">
          <button class="ch-step" onclick="chAdj('days',-1)">−</button>
          <span class="ch-stepper-val" id="ch-days-val">7</span>
          <span class="ch-stepper-unit">days</span>
          <button class="ch-step" onclick="chAdj('days',1)">+</button>
        </div>
      </div>
      <div class="ch-field">
        <label class="ch-label">Daily Goal</label>
        <div class="ch-stepper">
          <button class="ch-step" onclick="chAdj('goal',-1)">−</button>
          <span class="ch-stepper-val" id="ch-goal-val">10</span>
          <span class="ch-stepper-unit">hours</span>
          <button class="ch-step" onclick="chAdj('goal',1)">+</button>
        </div>
      </div>
      <button class="ch-start-btn" onclick="startChallenge()">Start Challenge</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
